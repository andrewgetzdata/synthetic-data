[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthetic-data"
version = "0.1.0"
description = "Generate synthetic data for example projects, MVPs, and tests"
requires-python = ">=3.10"
dependencies = [
    "faker>=33.0",
    "polars>=1.0",
    "pyarrow>=18.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
